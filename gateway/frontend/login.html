<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaSense 网关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#c8d6e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0e14 0%,#111b25 50%,#0a0e14 100%)}
.login-box{background:#111b25;border:1px solid #1a2a3a;border-radius:12px;padding:40px;width:360px;max-width:90vw;text-align:center}
.logo{text-align:center;margin:0 auto 16px}
.login-box h1{font-size:20px;margin-bottom:4px;color:#e0edf5}
.login-box .sub{font-size:12px;color:#5a7288;margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:12px;color:#6b8299;margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;background:#0a1018;border:1px solid #1a2a3a;border-radius:6px;color:#c8d6e0;font-size:14px;outline:none;transition:border .15s}
.form-group input:focus{border-color:#00c8ff}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#00E5FF,#7C4DFF);color:#fff;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.98)}
.error{color:#e74c3c;font-size:13px;margin-top:12px;display:none}
.loading{display:none;margin-top:12px;font-size:13px;color:#5a7288;text-align:center}
.copyright{text-align:center;margin-top:20px;font-size:11px;color:#3a4a5a}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo" style="background:none;width:auto;height:auto">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="24" r="2.5" fill="#00C8FF" filter="url(#lg)"/>
      <circle cx="44" cy="24" r="2" fill="#7C4DFF" opacity="0.8"/>
      <circle cx="32" cy="44" r="1.5" fill="#5A7288" opacity="0.6"/>
      <line x1="20" y1="24" x2="44" y2="24" stroke="#00C8FF" stroke-width="0.8" opacity="0.5"/>
      <line x1="20" y1="24" x2="32" y2="44" stroke="#7C4DFF" stroke-width="0.6" opacity="0.3"/>
      <line x1="44" y1="24" x2="32" y2="44" stroke="#5A7288" stroke-width="0.6" opacity="0.3"/>
      <circle cx="32" cy="24" r="4" fill="#00C8FF"/>
      <circle cx="32" cy="24" r="6" fill="#00C8FF" opacity="0.12"/>
      <defs><filter id="lg"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    </svg>
  </div>
  <h1>NovaSense 网关</h1>
  <p class="sub">感知网络 · 连接 · 管理</p>
  <div class="form-group">
    <label>管理密码</label>
    <input type="password" id="pw" placeholder="输入密码" autofocus
      onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" id="loginBtn" onclick="login()">登录</button>
  <div class="error" id="errorMsg">密码错误</div>
  <div class="loading" id="loadingMsg">验证中...</div>
  <div class="copyright">NovaSense &middot; 感知网络网关 v0.8.4</div>
</div>
<script>
async function login(){
  const pw=document.getElementById('pw').value;
  if(!pw) return;
  document.getElementById('errorMsg').style.display='none';
  document.getElementById('loadingMsg').style.display='block';
  document.getElementById('loginBtn').disabled=true;
  const showError=function(m){document.getElementById('errorMsg').textContent=m;document.getElementById('errorMsg').style.display='block';};
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.status==='ok'){
      if(d.setup_required){
        document.getElementById('loadingMsg').style.display='none';
        document.getElementById('loginBtn').disabled=false;
        const np=prompt('首次使用：当前为出厂口令。\n请设置新的管理口令（至少 10 位，不可包含 admin/password 等常见词）：');
        if(!np){showError('必须先设置新口令才能使用系统');return;}
        const rr=await fetch('/api/setup/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:np})});
        const dd=await rr.json();
        if(dd.error){showError('设置失败：'+dd.error);return;}
        alert('口令已设置，请用新口令重新登录');
        location.reload();
        return;
      }
      window.location.href='/ui/index.html';
    }else if(r.status===429){
      showError(d.error||'尝试过多，请稍后再试');
    }else{
      showError(d.error||'密码错误');
    }
  }catch(e){
    showError('连接失败');
  }
  document.getElementById('loadingMsg').style.display='none';
  document.getElementById('loginBtn').disabled=false;
}
</script>
</body>
</html>
