<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetCam Center - 登录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#c8d6e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0e14 0%,#111b25 50%,#0a0e14 100%)}
.login-box{background:#111b25;border:1px solid #1a2a3a;border-radius:12px;padding:40px;width:360px;max-width:90vw;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 16px;background:linear-gradient(135deg,#00E5FF,#7C4DFF);border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative}
.logo-v{color:#fff;font-size:42px;font-weight:800;font-style:italic;line-height:1;position:relative}
.logo-lens{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);border:3px solid #7C4DFF}
.logo-wave-l,.logo-wave-r{position:absolute;width:3px;height:24px;background:#fff;border-radius:2px;top:50%;transform:translateY(-50%)}
.logo-wave-l{left:8px;height:18px}
.logo-wave-r{right:8px;height:18px}
.login-box h1{font-size:20px;margin-bottom:4px;color:#e0edf5}
.login-box .sub{font-size:12px;color:#5a7288;margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:12px;color:#6b8299;margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;background:#0a1018;border:1px solid #1a2a3a;border-radius:6px;color:#c8d6e0;font-size:14px;outline:none;transition:border .15s}
.form-group input:focus{border-color:#00c8ff}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#00E5FF,#7C4DFF);color:#fff;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.98)}
.error{color:#e74c3c;font-size:13px;margin-top:12px;display:none}
.loading{display:none;margin-top:12px;font-size:13px;color:#5a7288;text-align:center}
.copyright{text-align:center;margin-top:20px;font-size:11px;color:#3a4a5a}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <span class="logo-v">V</span>
    <span class="logo-lens"></span>
    <span class="logo-wave-l"></span>
    <span class="logo-wave-r"></span>
  </div>
  <h1>NetCam Center</h1>
  <p class="sub">连接 · 管理 · 录制</p>
  <div class="form-group">
    <label>管理密码</label>
    <input type="password" id="pw" placeholder="输入密码" autofocus
      onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" id="loginBtn" onclick="login()">登录</button>
  <div class="error" id="errorMsg">密码错误</div>
  <div class="loading" id="loadingMsg">验证中...</div>
  <div class="copyright">NetCam Center &middot; VMS 导播系统</div>
</div>
<script>
async function login(){
  const pw=document.getElementById('pw').value;
  if(!pw) return;
  document.getElementById('errorMsg').style.display='none';
  document.getElementById('loadingMsg').style.display='block';
  document.getElementById('loginBtn').disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.status==='ok'){
      window.location.href='/ui/index.html';
    }else{
      document.getElementById('errorMsg').textContent=d.error||'密码错误';
      document.getElementById('errorMsg').style.display='block';
    }
  }catch(e){
    document.getElementById('errorMsg').textContent='连接失败';
    document.getElementById('errorMsg').style.display='block';
  }
  document.getElementById('loadingMsg').style.display='none';
  document.getElementById('loginBtn').disabled=false;
}
</script>
</body>
</html>
