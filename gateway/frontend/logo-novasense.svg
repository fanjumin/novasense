<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Constellation nodes -->
  <circle cx="16" cy="24" r="3" fill="#00C8FF" filter="url(#glow)"/>
  <circle cx="8" cy="40" r="2" fill="#7C4DFF" opacity="0.8"/>
  <circle cx="24" cy="40" r="2" fill="#7C4DFF" opacity="0.8"/>
  <circle cx="40" cy="24" r="4" fill="#00C8FF" filter="url(#glow)"/>
  <circle cx="32" cy="48" r="1.5" fill="#5A7288" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="16" y1="24" x2="8" y2="40" stroke="#00C8FF" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="24" x2="24" y2="40" stroke="#00C8FF" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="24" x2="40" y2="24" stroke="url(#logoGlow)" stroke-width="1" opacity="0.7"/>
  <line x1="24" y1="40" x2="32" y2="48" stroke="#5A7288" stroke-width="0.6" opacity="0.4"/>
  <line x1="8" y1="40" x2="32" y2="48" stroke="#5A7288" stroke-width="0.6" opacity="0.4"/>
  <!-- Text -->
  <text x="52" y="38" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="700" fill="#E8EDF2" letter-spacing="-0.5">Nova</text>
  <text x="52" y="38" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="28" font-weight="300" fill="#00C8FF" letter-spacing="-0.5"><tspan dx="98">Sense</tspan></text>
  <text x="52" y="54" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="400" fill="#5A7288" letter-spacing="3">CONSTELLATION OF PERCEPTION</text>
</svg>
