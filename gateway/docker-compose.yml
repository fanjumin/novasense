# ============================================
# NovaSense 网关 v0.8.4 — Docker 部署
# ============================================
# 使用方法:
#   docker compose up -d
#   docker compose logs -f
# 访问: http://localhost:8899
# ============================================

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: nms-mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nms-backend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mediamtx
    environment:
      - DATA_DIR=/app/data
      # AI sidecar(缝A/B): 未配 AI_SIDECAR_URL 时全部行为 = v0.8.4
      - AI_SIDECAR_URL=${AI_SIDECAR_URL:-http://127.0.0.1:8901}
      - AI_MODE=${AI_MODE:-shadow}
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-800}
    volumes:
      # 持久数据（数据库、录像、抓拍）
      - ./data:/app/data
      # 前端文件（方便热更新）
      - ./frontend:/app/frontend:ro
      # MediaMTX 配置（共享）
      - ./mediamtx/mediamtx.yml:/app/mediamtx/mediamtx.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # novasense-ai sidecar（AI 判帧/人脸向量, P0 缝A+B）
  # 契约: POST /v1/judge /v1/embed_face · GET /v1/healthz
  # 模型权重不入 git: 宿主机 ai-sidecar/models/ 经 fetch_models.sh 拉取
  # ============================================
  ai:
    build:
      context: ../ai-sidecar
      dockerfile: Dockerfile
    container_name: novasense-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8901:8901"
    environment:
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:-}
      - MODEL_DIR=/models
    volumes:
      - ../ai-sidecar/models:/models:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ============================================
  # RuView WiFi CSI 空间感知（方案 A 并置）
  # UI: http://localhost:3000/ui/index.html
  # UDP 5005: ESP32 CSI 帧入口
  # ============================================
  ruview:
    image: ruvnet/wifi-densepose:latest
    container_name: ruview-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "5005:5005/udp"
    environment:
      - RUVIEW_BIND_ADDR=0.0.0.0
      - RUVIEW_ALLOW_UNAUTHENTICATED=1
      # 只服务真实 ESP32 CSI 帧，禁用 simulated 演示数据
      - CSI_SOURCE=esp32
      # UDP 绑 0.0.0.0（默认 loopback 会拒收 docker-proxy 转发的包 → ICMP unreachable）
      - RUVIEW_UDP_BIND=0.0.0.0
    # UDP 数据面：绑 0.0.0.0 + 显式接受无 allowlist（局域网测试）
    command: ["--udp-insecure-lan"]
    volumes:
      # 源码三语 UI（EN/PL/zh-CN），只读挂载
      - ./ruview-ui:/app/ui:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

