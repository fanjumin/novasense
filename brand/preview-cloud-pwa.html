<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0E14">
<link rel="manifest" href="manifest.json">
<title>NovaSense Cloud — 品牌化预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#0A0E14;color:#E8EDF2;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ─── PWA 手机壳 ─── */
.phone-wrap{width:100%;max-width:400px;margin:0 auto;padding:16px 12px;min-height:100vh}
/* 标题栏 */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header .brand{display:flex;align-items:center;gap:8px}
.header .brand svg{width:24px;height:24px}
.header .brand span{font-size:16px;font-weight:600}
.header .actions{display:flex;gap:8px}
.header .actions button{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#5A7288;width:32px;height:32px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.header .actions button:hover{border-color:#00C8FF;color:#00C8FF}

/* 设备数 */
.section-label{font-size:11px;color:#5A7288;letter-spacing:1px;margin-bottom:4px;font-weight:500}
.count{font-size:28px;font-weight:700;margin-bottom:16px}
.count small{font-size:14px;font-weight:400;color:#5A7288;margin-left:8px}

/* 设备列表（大卡片样式，适合手机点按） */
.device-list{display:flex;flex-direction:column;gap:10px}
.device-card{display:flex;align-items:center;gap:12px;background:#0A121A;border:1px solid rgba(255,255,255,0.04);border-radius:10px;padding:12px;text-decoration:none;color:inherit;transition:all .15s;cursor:pointer}
.device-card:hover{border-color:#00C8FF;box-shadow:0 0 10px rgba(0,200,255,0.08)}

.device-card .thumb{width:56px;height:42px;border-radius:6px;background:radial-gradient(ellipse at center,#0D1A2A,#060A0F);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;overflow:hidden}
.device-card .thumb .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 30% 40%,rgba(255,255,255,0.12),transparent),radial-gradient(1px 1px at 70% 60%,rgba(0,200,255,0.1),transparent);pointer-events:none}
.device-card .thumb .live-dot{width:5px;height:5px;border-radius:50%;position:absolute;top:4px;left:4px;z-index:2}
.device-card .thumb .live-dot.on{background:#69F0AE}
.device-card .thumb .live-dot.off{background:#EF5350}
.device-card .thumb .live-dot.push{background:#00C8FF;animation:pulse 2s ease-in-out infinite}

.device-card .body{flex:1;min-width:0}
.device-card .body .name{font-size:14px;font-weight:500;margin-bottom:2px}
.device-card .body .meta{font-size:11px;color:#5A7288;display:flex;gap:8px}
.device-card .body .meta .tag{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:500;background:rgba(90,114,136,0.15);color:#5A7288}
.device-card .body .meta .tag.on{background:rgba(105,240,174,0.1);color:#69F0AE}
.device-card .body .meta .tag.push{background:rgba(0,200,255,0.1);color:#00C8FF}

.device-card .arrow{color:#5A7288;font-size:16px;flex-shrink:0}

/* 底部 Tab 栏 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:400px;margin:0 auto;display:flex;background:#080B10;border-top:1px solid rgba(255,255,255,0.04);padding:6px 0 env(safe-area-inset-bottom);z-index:10}
.bottom-nav .tab{flex:1;text-align:center;padding:6px 0;font-size:10px;color:#5A7288;cursor:pointer;transition:color .12s}
.bottom-nav .tab .ico{font-size:18px;display:block;margin-bottom:2px}
.bottom-nav .tab.active{color:#00C8FF}

/* 动画 */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>

<div class="phone-wrap">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="28" r="2.5" fill="#00C8FF"/>
        <circle cx="44" cy="28" r="2" fill="#7C4DFF" opacity="0.8"/>
        <circle cx="32" cy="48" r="1.5" fill="#5A7288" opacity="0.6"/>
        <line x1="20" y1="28" x2="44" y2="28" stroke="#00C8FF" stroke-width="0.8" opacity="0.5"/>
        <line x1="20" y1="28" x2="32" y2="48" stroke="#7C4DFF" stroke-width="0.6" opacity="0.3"/>
        <line x1="44" y1="28" x2="32" y2="48" stroke="#5A7288" stroke-width="0.6" opacity="0.3"/>
        <circle cx="32" cy="28" r="4" fill="#00C8FF" filter="url(#c)"/>
        <defs><filter id="c"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      </svg>
      <span>NovaSense</span>
    </div>
    <div class="actions">
      <button>⇄</button>
      <button>⏻</button>
    </div>
  </div>

  <div class="section-label">已连接设备</div>
  <div class="count">4 <small>在线 · 感知网络</small></div>

  <!-- Device list -->
  <div class="device-list">
    <a class="device-card" href="#">
      <div class="thumb">
        <div class="stars"></div>
        <span class="live-dot push"></span>📱
      </div>
      <div class="body">
        <div class="name">OPPO A79</div>
        <div class="meta">
          <span class="tag push">推流中</span>
          <span>1280×720</span>
          <span>25fps</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="device-card" href="#">
      <div class="thumb">
        <div class="stars"></div>
        <span class="live-dot on"></span>🏪
      </div>
      <div class="body">
        <div class="name">门口摄像头</div>
        <div class="meta">
          <span class="tag on">在线</span>
          <span>1920×1080</span>
          <span>RTSP</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="device-card" href="#">
      <div class="thumb">
        <div class="stars"></div>
        <span class="live-dot on"></span>🎥
      </div>
      <div class="body">
        <div class="name">波粒摄像头</div>
        <div class="meta">
          <span class="tag on">在线</span>
          <span>1920×1080</span>
          <span>WAPA</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="device-card" href="#" style="opacity:0.5">
      <div class="thumb">
        <div class="stars"></div>
        <span class="live-dot off"></span>📷
      </div>
      <div class="body">
        <div class="name">USB 摄像头</div>
        <div class="meta">
          <span class="tag" style="color:#EF5350">离线</span>
          <span>驱动异常</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- Add device -->
    <a class="device-card" href="#" style="border:1px dashed rgba(255,255,255,0.08);background:transparent">
      <div class="thumb" style="background:transparent">✨</div>
      <div class="body">
        <div class="name" style="color:#5A7288">添加感知设备</div>
        <div class="meta"><span>点亮下一颗星</span></div>
      </div>
      <span class="arrow" style="color:#5A7288">+</span>
    </a>
  </div>

  <div style="height:60px"></div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="tab active"><span class="ico">✦</span>设备</div>
  <div class="tab"><span class="ico">◈</span>回放</div>
  <div class="tab"><span class="ico">⊙</span>告警</div>
  <div class="tab"><span class="ico">◆</span>我的</div>
</div>

</body>
</html>
