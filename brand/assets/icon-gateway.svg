<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="g1"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/><stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>
  <!-- Central star -->
  <circle cx="32" cy="32" r="5" fill="#00C8FF" filter="url(#g1)"/>
  <!-- Orbit rings -->
  <circle cx="32" cy="32" r="14" stroke="#00C8FF" stroke-width="1.2" opacity="0.4"/>
  <circle cx="32" cy="32" r="22" stroke="#7C4DFF" stroke-width="0.8" opacity="0.25"/>
  <circle cx="32" cy="32" r="28" stroke="#5A7288" stroke-width="0.5" opacity="0.15"/>
  <!-- Node on orbit -->
  <circle cx="46" cy="32" r="2" fill="#7C4DFF" opacity="0.7"/>
  <line x1="46" y1="32" x2="32" y2="32" stroke="#7C4DFF" stroke-width="0.6" opacity="0.4"/>
</svg>
