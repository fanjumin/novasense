<title>视频流管理平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0a0e14; color: #d0d8e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #141e2a 0%, #0a121a 100%); padding: 12px 16px; border-bottom: 1px solid #1e2d3d; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 17px; font-weight: 600; color: #00c8ff; }
.tabs { display: flex; gap: 1px; background: #0d151f; padding: 0 12px; border-bottom: 1px solid #1e2d3d; }
.tab { padding: 9px 14px; cursor: pointer; font-size: 13px; color: #6b8299; border-bottom: 2px solid transparent; }

.tab.active { color: #00c8ff; border-bottom-color: #00c8ff; }
.content { padding: 12px; display: none; }
.content.active { display: block; }

/* Live grid */
.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.live-grid.cols2 { grid-template-columns: 1fr 1fr; }
.live-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.live-grid.cols4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media (max-width:900px) { .live-grid.cols3,.live-grid.cols4 { grid-template-columns: 1fr 1fr; } }
@media (max-width:600px) { .live-grid { grid-template-columns: 1fr; } }
.live-card { background: #0a121a; border: 1px solid #1a2a3a; border-radius: 6px; overflow: hidden; position:relative; }

.live-card .preview .icon { font-size: 28px; }

/* Add card */

.add-card:hover { border-color: #00c8ff; color: #00c8ff; background: #0d1a2a; }

.add-card .hint { font-size: 13px; }

.card { background: #111b25; border: 1px solid #1a2a3a; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
.card h3 { font-size: 13px; margin-bottom: 8px; color: #8aa0b8; font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #1a2a3a; }
th { color: #6b8299; font-weight: 500; background: #0d151f; }

.badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }

.badge-youtube { background:#3a1a1a; color:#ff8a80; }
.ptz-bar { display:flex; align-items:center; gap:8px; padding:6px 8px; border-top:1px solid #1a2a3a; background:#0a1018; }
.ptz-pad { position:relative; width:72px; height:72px; flex-shrink:0; }
.ptz-pad-btn { position:absolute; width:22px; height:22px; border:none; border-radius:3px; background:#141e2a; color:#8aa0b8; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .1s; border:1px solid #1e2d3d; }
.ptz-pad-btn:hover { background:#1a2a3a; color:#00c8ff; border-color:#00c8ff; }

.ptz-pad-up { top:0; left:50%; transform:translateX(-50%); }
.ptz-pad-down { bottom:0; left:50%; transform:translateX(-50%); }

.ptz-zoom { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.ptz-zoom-btn { width:24px; height:20px; border:none; border-radius:3px; background:#141e2a; color:#8aa0b8; font-size:11px; line-height:1; cursor:pointer; border:1px solid #1e2d3d; display:flex; align-items:center; justify-content:center; }

.ptz-preset-btn:hover { background:#1a2a3a; color:#00c8ff; }
.dir-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:#0a0e14; }

.btn { display:inline-flex; align-items:center; gap:2px; padding:4px 10px; border:none; border-radius:4px; font-size:12px; cursor:pointer; font-weight:500; }
.btn-sm { padding:3px 8px; font-size:11px; }
.btn-primary { background:#005c8a; color:#fff; }

.btn-danger { background:#8a1a1a; color:#fff; }

.btn-success { background:#1b5e20; color:#fff; }

.btn-outline { background:transparent; border:1px solid #2a3a4a; color:#8aa0b8; }
.btn-outline:hover { background:#1a2a3a; }
.btn-warning { background:#8a6a00; color:#fff; }
.toolbar { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.form-group { margin-bottom:8px; }
.form-group label { display:block; font-size:12px; color:#6b8299; margin-bottom:3px; }
.form-group input,.form-group select { width:100%; padding:6px 10px; background:#0a121a; border:1px solid #1e2d3d; border-radius:4px; color:#d0d8e0; font-size:12px; }

.stat-card { background:#111b25; border:1px solid #1a2a3a; border-radius:6px; padding:10px; text-align:center; }

.dir-grid { display:flex; flex-direction:column; gap:8px; }
.dir-main { background:#000; border:2px solid #00c8ff; border-radius:6px; height:360px; position:relative; overflow:hidden; }

.dir-preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:6px; }
.dir-preview { background:#000; border:1px solid #1a2a3a; border-radius:4px; height:150px; position:relative; overflow:hidden; cursor:pointer; transition:border-color .15s; }

.modal { background:#141e2a; border-radius:8px; padding:18px; max-width:520px; width:92%; max-height:80vh; overflow-y:auto; border:1px solid #1e2d3d; }

<body>
<div class="header">
  <h1>NetCam Center</h1>
  <span style="font-size:12px;color:#5a7288" id="headerStatus">加载中...</span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span style="font-size:11px;color:#3a5a6a">192.0.2.107:8899</span>
    <button class="btn btn-xs btn-outline" onclick="logout()" style="font-size:11px;padding:2px 8px">退出</button>

</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('live')">📺 监控</div>
  <div class="tab" onclick="switchTab('recordings')">💾 录像</div>
  <div class="tab" onclick="switchTab('schedule')">⏰ 定时</div>
  <div class="tab" onclick="switchTab('snapshots')">📸 抓拍</div>
  <div class="tab" onclick="switchTab('director')">🎬 导播</div>

  <div class="tab" onclick="switchTab('status')">📊 状态</div>
</div>

<!-- LIVE -->
<div id="tab-live" class="content active">
  <div class="toolbar">
    <button class="btn btn-sm btn-outline" onclick="setLayout(1)">■</button>
    <button class="btn btn-sm btn-primary" onclick="setLayout(2)">■■</button>
    <button class="btn btn-sm btn-outline" onclick="setLayout(3)">■■■</button>
    <button class="btn btn-sm btn-outline" onclick="setLayout(4)">■■■■</button>
    <button class="btn btn-sm btn-outline" onclick="openAddForm()">+ 添加</button>
    <button class="btn btn-sm btn-outline" onclick="discoverDevices()">📡 扫描</button>

<!-- RECORDINGS -->
<div id="tab-recordings" class="content">

    <button class="btn btn-outline" onclick="loadRecordings()">🔄 刷新</button>

  <div class="card" style="padding:0">
    <table><thead><tr><th>设备</th><th>时间</th><th>时长</th><th>大小</th><th>播放</th></tr></thead>
      <tbody id="recTable"></tbody>
    </table>
  </div>
</div>

<!-- SCHEDULE -->
<div id="tab-schedule" class="content">
  <div class="toolbar">
    <button class="btn btn-primary" onclick="showAddSchedule()">+ 添加计划</button>
    <button class="btn btn-outline" onclick="loadSchedules()">🔄 刷新</button>
  </div>
  <div class="card" style="padding:0">
    <table><thead><tr><th>名称</th><th>设备</th><th>时段</th><th>天数</th><th>分段</th><th>状态</th><th>上次触发</th><th>操作</th></tr></thead>
      <tbody id="scheduleTable"></tbody>
    </table>
  </div>
</div>

<!-- SNAPSHOTS -->
<div id="tab-snapshots" class="content">
  <div class="toolbar">
    <button class="btn btn-primary" onclick="showAddSnap()">+ 开启抓拍</button>
    <button class="btn btn-outline" onclick="loadSnapshots()">🔄 刷新</button>
  </div>
  <div class="live-grid" id="snapGrid"></div>
</div>

<!-- DIRECTOR -->
<div id="tab-director" class="content">
  <div class="toolbar">
    <span id="dirStatus" style="font-size:12px;color:#5a7288">加载中...</span>
    <span style="flex:1"></span>
    <button class="btn btn-sm btn-primary" onclick="switchSource()">切换</button>
    <button class="btn btn-sm btn-outline" onclick="stopPGM()">⏹ 停止</button>
    <button class="btn btn-sm btn-outline" onclick="loadDirector()">🔄 刷新</button>

</div>

<!-- Add Camera Inline Form (embedded in live grid) -->
<div id="addFormCard" class="live-card" style="display:none">
  <div style="padding:12px;display:flex;flex-direction:column;gap:8px;width:100%">
    <div style="font-size:13px;font-weight:500;color:#00c8ff">添加摄像头</div>
    <div class="form-group"><label>名称</label><input id="afName" placeholder="大门摄像头"></div>

    <div class="modal-actions">

<div id="modalSnap" class="modal-overlay" style="display:none" onclick="closeIfBg(event,'modalSnap')">

    <div class="form-group"><label>设备</label><select id="fSnapDev"></select></div>
    <div class="form-row">
      <div class="form-group"><label>间隔(秒)</label><input id="fSnapInt" type="number" value="30" min="10"></div>
      <div class="form-group"><label>保留天数(0=永久)</label><input id="fSnapRet" type="number" value="7" min="0"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeById('modalSnap')">取消</button>
      <button class="btn btn-primary" onclick="submitSnap()">开启</button>
    </div>
  </div>
</div>

<script>
const API = '';
const MTX_HLS = 'http://192.0.2.107:8888';
let proxyStatus = {};

function toast(m,t='s') { const e=document.createElement('div'); e.className=`toast toast-${t}`; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2500); }

async function api(p,opts={}) {
  const cfg = { headers: {'Content-Type':'application/json'}, ...opts };
  if (cfg.body && typeof cfg.body === 'object') cfg.body = JSON.stringify(cfg.body);
  const r = await fetch(API + p, cfg);
  if (r.status===401) { window.location.href='/ui/login.html'; return {error:'unauthorized'}; }
  return r.json().catch(()=>({status:r.status}));
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');

  if (name==='recordings') { loadRecordings(); }
  if (name==='schedule') { loadSchedules(); }
  if (name==='snapshots') { loadSnapshots(); }
  if (name==='status') loadStatus();
}

async function toggleLive(id) {
  const w = proxyStatus[id] || false;
  const btn = document.getElementById(`lvBtn-${id}`);
  const prev = document.getElementById(`lvPrev-${id}`);
  const vid = document.getElementById(`lvVid-${id}`);

  if (!w) {
    btn.textContent='...'; btn.className='btn btn-sm btn-outline';
    const r = await api(`/api/proxy/start/${id}`,{method:'POST'});
    if (r.status==='started') {
      proxyStatus[id]=true;
      btn.textContent='停止'; btn.className='btn btn-sm btn-danger';
      prev.style.display='none'; vid.style.display='block';
      document.getElementById('lvPtz-'+id).style.display='flex';
      document.getElementById('lvVol-'+id).style.display='';
      document.getElementById('lvFull-'+id).style.display='';
      document.getElementById('resSel-'+id).disabled = false;
      document.getElementById('lvFsBtn-'+id).style.display='flex';
      // Pre-fetch to set MediaMTX cookie
      fetch(MTX_HLS+'/live/'+id+'/index.m3u8', {credentials: 'include'}).catch(function(){});
      // Use hls.js for HLS playback
      var hls = new Hls({
        xhrSetup: function(xhr, url) {
          xhr.withCredentials = true;
        }
      });
      hls.loadSource(MTX_HLS+'/live/'+id+'/index.m3u8');
      hls.attachMedia(vid);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        vid.play().catch(function(){});
      });
      window['hls_'+id] = hls;
    } else {
      btn.textContent='观看'; btn.className='btn btn-sm btn-success';
      toast(r.error||'失败','e');
    }
  } else {
    await api(`/api/proxy/stop/${id}`,{method:'POST'});
    proxyStatus[id]=false;
    btn.textContent='观看'; btn.className='btn btn-sm btn-success';
    vid.style.display='none'; vid.src='';
    prev.style.display='flex';
    prev.innerHTML='<div class="icon">📷</div><div style="color:#6b8299">已停止</div>';
    prev.onclick=null;
    document.getElementById('lvPtz-'+id).style.display='none';
    document.getElementById('lvVol-'+id).style.display='none';
    document.getElementById('lvFull-'+id).style.display='none';
    document.getElementById('resSel-'+id).disabled = true;
    document.getElementById('lvFsBtn-'+id).style.display='none';
    if (window['hls_'+id]) { window['hls_'+id].destroy(); delete window['hls_'+id]; }
  }
}

function openAddForm() {
  ['afName','afUrl','afProto','afGroup'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('addFormCard').style.display='flex';
  document.getElementById('addFormCard').className='live-card';
  document.getElementById('afUrl').placeholder = 'rtsp://... 或 http://...';
}

function closeAddForm() {
  document.getElementById('addFormCard').style.display='none';
}

async function submitAddForm() {
  var proto = document.getElementById('afProto').value;
  var url = document.getElementById('afUrl').value;
  var name = document.getElementById('afName').value;
  if (!name) { name = url.replace(/^rtsp:\/\//,'').replace(/^http:\/\//,'').replace('/dev/','').split('/')[0]; }
  if (!url) { toast('请填地址','e'); return; }

  // Auto-fix protocol prefix for USB
  if (proto === 'usb') { url = url; }
  else if (proto === 'http' && !url.startsWith('http')) { url = 'http://'+url; }
  else if (proto === 'rtsp' && !url.startsWith('rtsp://')) { url = 'rtsp://'+url; }

  var d = {
    name: name,
    protocol: proto,
    url: url,
    username: '',
    password: '',
    group_name: document.getElementById('afGroup').value
  };
  if (!d.url) { toast('请填地址','e'); return; }

  const r = await api('/api/devices', {method:'POST', body:d});
  if (r.id) {
    toast('摄像头已添加');
    closeAddForm();
    await renderLive();
    // Auto-start watching
    setTimeout(() => toggleLive(r.id), 500);
  } else {
    toast('添加失败','e');
  }
}

async function delCam(id) {
  if (!confirm('删除此摄像头?')) return;
  if (proxyStatus[id]) await toggleLive(id);
  await api(`/api/devices/${id}`, {method:'DELETE'});
  toast('已删除');
  renderLive();
  loadStatus();
}

  document.getElementById('fSchedDev').innerHTML=d.map(v=>`<option value="${v.id}" ${v.id===x.device_id?'selected':''}>${esc(v.name)}</option>`).join('');

  document.getElementById('fSchedDur').value=x.duration_min;
  document.getElementById('fSchedEnabled').checked=x.enabled;
  document.querySelectorAll('.day-cb').forEach(c=>c.checked=false);
  if (x.days){
    x.days.split(',').forEach(d=>{
      const cb=document.querySelector(`.day-cb[value="${d.trim()}"]`);
      if(cb)cb.checked=true;
    });
    document.getElementById('dayAll').checked=false;

// ===== PTZ CONTROL =====
let ptzTimers = {};

async function ptzStart(id, action) {
  const spd = document.getElementById('ptzSpd-'+id);
  const speed = spd ? parseInt(spd.value) : 3;
  const r = await api('/api/ptz/'+id+'/'+action+'?speed='+speed, {method:'POST'});
  if (r.status!=='ok') toast(r.error||'云台指令失败','e');
}

async function ptzStop(id) {
  if (ptzTimers[id]) { clearTimeout(ptzTimers[id]); delete ptzTimers[id]; }
  await api('/api/ptz/'+id+'/stop', {method:'POST'});
}

async function ptzPreset(id, num) {
  const r = await api('/api/ptz/'+id+'/preset/'+num, {method:'POST'});
  if (r.status!=='ok') toast(r.error||'预置位调用失败','e');
}

// ===== DIRECTOR =====
let dirSources = [];
let selectedSource = null;

async function loadDirector() {
  // Get director status
  const status = await api('/api/director');
  if (!status || status.error) return;

  // Get sources
  const sources = await api('/api/director/sources');
  dirSources = sources || [];

  document.getElementById('dirStatus').textContent =
    'PGM: ' + (status.pgm?.status || 'idle') +
    ' | 信号: ' + (sources?.length || 0) + ' 路';

  // Render PGM
  const pgmVid = document.getElementById('dirPGMVid');
  const pgmPlace = document.getElementById('dirPGMPlaceholder');
  if (status.pgm?.status === 'live') {
    pgmVid.style.display = 'block';
    pgmPlace.style.display = 'none';
    if (!pgmVid.src || pgmVid.src.indexOf('director') < 0) {
      pgmVid.src = MTX_HLS + status.pgm.output_url;
    }
    pgmVid.play().catch(()=>{});
  } else {
    pgmVid.style.display = 'none';
    pgmPlace.style.display = 'flex';
  }

  // Render preview grid
  const grid = document.getElementById('dirPreview');
  let html = '';
  for (const s of sources) {
    if (s.type === 'black' || s.type === 'image') {
      html += '<div class="dir-preview dir-sub'+(selectedSource===s.id?' active':'')+'" onclick="selectSource(\''+s.id+'\')">';
      html += '<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#1a1a2e;color:#3a4a5a">';
      html += s.type==='black'?'⏹ 黑场':'📊 测试图';
      html += '</div>';
      html += '<div class="dir-label">'+esc(s.name)+'</div></div>';
      continue;
    }
    const hlsUrl = '/live/'+s.device_id+'/index.m3u8';
    html += '<div class="dir-preview dir-sub'+(selectedSource===s.id?' active':'')+'" onclick="selectSource(\''+s.id+'\')">';
    html += '<video muted autoplay playsinline src="'+MTX_HLS+hlsUrl+'"></video>';
    html += '<div class="dir-label">'+esc(s.name)+'</div></div>';
  }
  if (sources.length === 0) {
    html = '<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:#3a4a5a;font-size:13px;min-height:200px">暂无信号源</div>';
  }
  grid.innerHTML = html;

  setTimeout(() => {
    grid.querySelectorAll('video').forEach(v => v.play().catch(()=>{}));
  }, 500);
}

function selectSource(id) {
  selectedSource = id;
  loadDirector();
}

async function switchSource() {
  const id = selectedSource || (dirSources[0] && dirSources[0].id);
  if (!id) { toast('请先选择一个信号源','i'); return; }
  const r = await api('/api/director/switch', {method:'POST', body:{source_id:id, transition:'cut'}});
  if (r.status === 'switched') {
    toast('已切换到: '+id);
    loadDirector();
  } else {
    toast(r.error||'切换失败','e');
  }
}

async function stopPGM() {
  const r = await api('/api/director/stop', {method:'POST'});
  if (r.status === 'stopped') {
    toast('PGM 已停止');
    loadDirector();
  }
}

// ===== RESOLUTION SWITCH =====
async function changeRes(id, res) {
  var body;
  if (res === 'auto') {
    body = JSON.stringify({});
  } else {
    var parts = res.split('x');
    body = JSON.stringify({width: parseInt(parts[0]), height: parseInt(parts[1])});
  }
  var btn = document.getElementById('lvBtn-'+id);
  var wasRunning = proxyStatus[id] || false;

  var r = await fetch(API+'/api/proxy/config/'+id, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: body
  });
  const data = await r.json();
  if (data.status === 'updated') {
    toast('已切换到 '+res);
    // Reconnect video
    if (wasRunning && data.deviceId === id) {
      // Reconnect hls.js after resolution switch
      if (window['hls_'+id]) { window['hls_'+id].destroy(); }
      var vid2 = document.getElementById('lvVid-'+id);
      if (vid2) {
        var h2 = new Hls({
          xhrSetup: function(x, u) { x.withCredentials = true; }
        });
        h2.loadSource(MTX_HLS+'/live/'+id+'/index.m3u8');
        h2.attachMedia(vid2);
        h2.on(Hls.Events.MANIFEST_PARSED, function() { vid2.play().catch(function(){}); });
        window['hls_'+id] = h2;
      }
    }
  } else {
    toast(data.error || '切换失败','e');
  }
}

// Wrap switchTab to add director support
const _origSwitch = switchTab;
switchTab = function(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  const tab = document.querySelector(`.tab[onclick*="${name}"]`);
  if (tab) tab.classList.add('active');
  const content = document.getElementById('tab-'+name);
  if (content) content.classList.add('active');
  if (name==='live') renderLive();
  if (name==='recordings') loadRecordings();
  if (name==='schedule') loadSchedules();
  if (name==='snapshots') loadSnapshots();
  if (name==='director') loadDirector();
  if (name==='motion') loadMotion();
  if (name==='status') loadStatus();
};

// ===== MOTION DETECTION =====
async function loadMotion() {
  var devs = await api('/api/devices');
  var el = document.getElementById('motionCards');
  if (!devs.length) { el.innerHTML = '<div style="color:#3a4a5a;padding:20px">暂无摄像头</div>'; return; }

  var html = '';
  for (var d of devs) {
    var cfg = await api('/api/motion/config/'+d.id);
    var events = await api('/api/motion/events/'+d.id+'?limit=10');
    var on = cfg && cfg.enabled;
    html += '<div class="live-card" style="padding:10px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    html += '<span style="font-size:13px;font-weight:500">'+esc(d.name)+'</span>';
    html += '<button class="btn btn-sm '+(on?'btn-danger':'btn-success')+'" onclick="toggleMotion(\''+d.id+'\','+(!on)+')">'+(on?'关闭检测':'开启检测')+'</button>';
    html += '</div>';
    html += '<div style="display:flex;gap:12px;font-size:11px;color:#6b8299;margin-bottom:6px">';
    html += '灵敏度: <input type="range" min="0.1" max="0.9" step="0.1" value="'+(cfg?cfg.sensitivity:0.3)+'" ';
    html += 'onchange="setMotionSens(\''+d.id+'\',this.value)" style="width:60px"> ';
    html += '冷却: <input type="number" value="'+(cfg?cfg.cooldown_sec:30)+'" min="5" max="300" ';
    html += 'onchange="setMotionCool(\''+d.id+'\',this.value)" style="width:50px;background:#0a121a;border:1px solid #1e2d3d;color:#8aa0b8;border-radius:2px;padding:1px 3px">秒';
    html += '</div>';
    html += '<div style="font-size:11px;color:#5a7288">最近事件:</div>';
    if (events && events.length) {
      html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">';
      for (var e of events.slice(0,6)) {
        html += '<a href="/snapshots/motion_'+d.id+'/'+e.snapshot_path.split('/').pop()+'" target="_blank" ';
        html += 'style="width:60px;height:40px;overflow:hidden;border-radius:3px;border:1px solid #1a2a3a">';
        html += '<img src="/snapshots/motion_'+d.id+'/'+e.snapshot_path.split('/').pop()+'" style="width:100%;height:100%;object-fit:cover"></a>';
      }
      html += '</div>';
    } else {
      html += '<div style="color:#3a4a5a;font-size:11px;margin-top:4px">暂无事件</div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;

  // Timeline (all events grouped)
  var allEvents = await api('/api/motion/events/all?limit=50');
  var tl = document.getElementById('motionTimeline');
  if (!allEvents || !allEvents.length) { tl.innerHTML = ''; return; }
  var tlHtml = '<div class="card"><h3>📊 运动检测时间轴</h3><div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:8px">';
  for (var e of allEvents.slice(0,50)) {
    var ts = new Date(e.detected_at);
    var timeStr = ts.getHours().toString().padStart(2,'0')+':'+ts.getMinutes().toString().padStart(2,'0');
    var dev = devs.find(function(x){return x.id===e.device_id});
    tlHtml += '<a href="/snapshots/motion_'+e.device_id+'/'+e.snapshot_path.split('/').pop()+'" target="_blank" ';
    tlHtml += 'title="'+(dev?esc(dev.name):e.device_id)+' '+ts.toLocaleString()+'" ';
    tlHtml += 'style="width:50px;height:34px;overflow:hidden;border-radius:3px;border:1px solid #8a2a2a;position:relative">';
    tlHtml += '<img src="/snapshots/motion_'+e.device_id+'/'+e.snapshot_path.split('/').pop()+'" style="width:100%;height:100%;object-fit:cover">';
    tlHtml += '<div style="position:absolute;bottom:0;left:0;right:0;background:rgba(200,0,0,0.6);color:#fff;font-size:8px;text-align:center">'+timeStr+'</div>';
    tlHtml += '</a>';
  }
  tlHtml += '</div></div>';
  tl.innerHTML = tlHtml;
}

async function toggleMotion(id, enable) {
  var cfg = {device_id: id, enabled: enable, sensitivity: 0.3, cooldown_sec: 30};
  await api('/api/motion/config/'+id, {method:'POST', body:cfg});
  toast(enable?'运动检测已开启':'已关闭');
  loadMotion();
}

async function setMotionSens(id, val) {
  var cfg = await api('/api/motion/config/'+id);
  if (!cfg) cfg = {device_id: id, enabled: false};
  cfg.sensitivity = parseFloat(val);
  await api('/api/motion/config/'+id, {method:'POST', body:cfg});
}

async function setMotionCool(id, val) {
  var cfg = await api('/api/motion/config/'+id);
  if (!cfg) cfg = {device_id: id, enabled: false};
  cfg.cooldown_sec = parseInt(val);
  await api('/api/motion/config/'+id, {method:'POST', body:cfg});
}

async function addMotion() {
  var devs = await api('/api/devices');
  if (!devs.length) { toast('先添加摄像头','e'); return; }
  for (var d of devs) {
    await api('/api/motion/config/'+d.id, {method:'POST', body:{device_id:d.id, enabled:true, sensitivity:0.3, cooldown_sec:30}});
  }
  toast('已为所有设备开启运动检测');
  loadMotion();
}

// ===== DEVICE DISCOVERY =====
async function discoverDevices() {
  var btn = event.target;
  btn.textContent = '扫描中...';
  btn.disabled = true;
  var results = await api('/api/discover');
  btn.textContent = '扫描局域网';
  btn.disabled = false;
  if (!results || !results.length) { toast('未发现新设备','i'); return; }
  var html = results.map(function(r,i){
    return '<div style="padding:6px;border-bottom:1px solid #1a2a3a;font-size:12px;display:flex;align-items:center;gap:8px">'+
      '<span style="background:#1a2a3a;padding:2px 6px;border-radius:3px;font-size:10px">'+(r.protocol||'?').toUpperCase()+'</span>'+
      '<span>'+esc(r.ip)+'</span>'+
      '<span style="color:#5a7288">'+esc(r.url||'')+'</span>'+
      '<button class="btn btn-sm btn-success" onclick="quickAdd(\''+esc(r.url)+'\')">添加</button></div>';
  }).join('');
  toast('<div style="max-height:300px;overflow-y:auto">'+html+'</div>','i');
}

async function quickAdd(url) {
  var name = url.replace(/^rtsp:\/\//,'').split('/')[0];
  await api('/api/devices', {method:'POST', body:{name:name, protocol:'rtsp', url:url}});
  toast('已添加 '+name);
  renderLive();
}
