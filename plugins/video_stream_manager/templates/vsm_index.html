<!DOCTYPE html>
<html lang="{{ 'zh' if request.accept_languages.best == 'zh' else 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ self.t('page_title') }}</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0e14;color:#d0d8e0;min-height:100vh}
.header{background:linear-gradient(135deg,#141e2a,#0a121a);padding:12px 16px;border-bottom:1px solid #1e2d3d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:600;color:#00c8ff;flex:1}
.toolbar{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;align-items:center}
.toolbar button,.toolbar select{padding:4px 10px;border:1px solid #1e2d3d;border-radius:4px;background:#0d151f;color:#c0d0e0;font-size:12px;cursor:pointer}
.toolbar button:hover{background:#1a2a3a;border-color:#00c8ff}
.toolbar .btn-primary{background:#005c8a;border-color:#005c8a;color:#fff}
.toolbar .btn-primary:hover{background:#0077b0}
.toolbar .btn-danger{background:#8a1a1a;border-color:#8a1a1a;color:#fff}
.toolbar .btn-success{background:#1b5e20;border-color:#1b5e20;color:#fff}
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
@media(max-width:600px){.live-grid{grid-template-columns:1fr}}
.card{background:#0a121a;border:1px solid #1a2a3a;border-radius:6px;overflow:hidden}
.card video{width:100%;aspect-ratio:16/9;background:#060a0f;display:block}
.card .preview{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#060a0f;color:#3a4a5a;font-size:13px;flex-direction:column;gap:4px}
.card .info{padding:6px 8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:12px}
.card .info .name{font-weight:500}
.card .info .badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px}
.badge-online{background:#0d3b2a;color:#69f0ae}
.badge-offline{background:#3a1a1a;color:#ef9a9a}
.settings-panel{position:fixed;top:60px;right:20px;width:340px;max-height:80vh;overflow-y:auto;background:#0d151f;border:1px solid #1e2d3d;border-radius:8px;padding:16px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.5);display:none}
.settings-panel.open{display:block}
.settings-panel .title{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:600}
.settings-panel .close{background:none;border:none;color:#6b8299;cursor:pointer;font-size:16px}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:12px;color:#6b8299;margin-bottom:3px}
.form-group input,.form-group select{width:100%;padding:5px 8px;background:#0a121a;border:1px solid #1e2d3d;border-radius:4px;color:#d0d8e0;font-size:12px}
.form-group input:focus{outline:none;border-color:#00c8ff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toast{position:fixed;bottom:20px;right:20px;padding:8px 14px;border-radius:4px;color:#fff;font-size:12px;z-index:999}
.toast-s{background:#1b5e20}
.toast-e{background:#8a1a1a}
.empty{padding:30px;text-align:center;color:#3a4a5a;font-size:14px}
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.btn-group button{padding:3px 8px;border:1px solid #1e2d3d;border-radius:3px;background:#0d151f;color:#8aa0b8;font-size:11px;cursor:pointer}
.btn-group button:hover{background:#1a2a3a;color:#00c8ff}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#1a2a3a;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#00c8ff;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1>{{ self.t('dashboard') }}</h1>
  <span style="font-size:11px;color:#5a7288" id="statusText">
    {% if api_url %}🟢 VSM {{ api_url }}{% else %}🔴 {{ self.t('connect_error') }}{% endif %}
  </span>
</div>

<div class="toolbar">
  <button class="btn-primary" onclick="showSettings()">⚙️ {{ self.t('settings') }}</button>
  <button class="btn-success" onclick="syncDevices()">🔄 {{ self.t('sync_devices') }}</button>
  <select id="groupFilter" onchange="filterGroup()">
    <option value="">{{ self.t('all_groups') }}</option>
  </select>
  <span style="flex:1"></span>
  <button onclick="setCols(1)">1</button>
  <button class="btn-primary" onclick="setCols(2)">2</button>
  <button onclick="setCols(3)">3</button>
  <button onclick="setCols(4)">4</button>
</div>

<div class="live-grid cols2" id="deviceGrid"></div>

<div class="empty" id="emptyHint" style="display:none">{{ self.t('no_devices') }}</div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="title">
    <span>{{ self.t('config_title') }}</span>
    <button class="close" onclick="hideSettings()">✕</button>
  </div>
  <div class="form-group">
    <label>{{ self.t('vsm_api_url') }}</label>
    <input id="cfgVsmUrl" placeholder="http://192.0.2.107:8899">
  </div>
  <div class="form-group">
    <label>{{ self.t('hls_base_url') }}</label>
    <input id="cfgHlsUrl" placeholder="http://192.0.2.107:8888">
  </div>
  <div class="form-group">
    <label>{{ self.t('whep_base_url') }}</label>
    <input id="cfgWhepUrl" placeholder="http://192.0.2.107:8889">
  </div>
  <button class="btn-primary" onclick="saveConfig()" style="width:100%;padding:6px;border:none;border-radius:4px;cursor:pointer;font-size:12px">{{ self.t('save_config') }}</button>
</div>

<!-- Phone Camera Settings Panel -->
<div class="settings-panel" id="phonePanel">
  <div class="title">
    <span id="phoneTitle">{{ self.t('phone_settings') }}</span>
    <button class="close" onclick="hidePhone()">✕</button>
  </div>
  <div id="phoneControls"></div>
  <div style="margin-top:8px;color:#6b8299;font-size:11px" id="phoneStatus"></div>
</div>

<script>
const API_BASE = '/plugin/vsm/api';
let cols = 2;
let devices = [];

function toast(msg, type='s') {
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function api(path, opts={}) {
  var cfg = {headers:{'Content-Type':'application/json'}, ...opts};
  if (cfg.body && typeof cfg.body === 'object') cfg.body = JSON.stringify(cfg.body);
  var r = await fetch(API_BASE + path, cfg);
  if (r.status === 401) { window.location.href = '/login'; return {error:'unauthorized'}; }
  return r.json().catch(() => ({status:r.status}));
}

async function loadDevices() {
  devices = await api('/devices');
  renderDevices();
  var gf = document.getElementById('groupFilter');
  var groups = {};
  devices.forEach(d => { if (d.group_name) groups[d.group_name] = true; });
  var sel = gf.value;
  gf.innerHTML = '<option value="">{{ self.t('all_groups') }}</option>';
  Object.keys(groups).sort().forEach(g => {
    gf.innerHTML += '<option value="'+g+'"'+(sel===g?' selected':'')+'>'+g+'</option>';
  });
}

function renderDevices() {
  var grid = document.getElementById('deviceGrid');
  var selGroup = document.getElementById('groupFilter').value;
  var filtered = selGroup ? devices.filter(d => d.group_name === selGroup) : devices;
  document.getElementById('emptyHint').style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(d => {
    var w = d.proxy_status || false;
    return `<div class="card" id="card-${d.id}">
      <div id="prev-${d.id}" class="preview"${w?' style="display:none"':''}>
        <div>📷</div>
        <div>${esc(d.name)} <span class="badge ${d.status==='online'?'badge-online':'badge-offline'}">${d.status==='online'?'{{ self.t('online') }}':'{{ self.t('offline') }}'}</span></div>
      </div>
      <video id="vid-${d.id}" muted playsinline${w?'':' style="display:none"'}></video>
      <div class="info">
        <span class="name">${esc(d.name)} ${d.group_name?'<span style="font-size:9px;color:#5a7288">'+esc(d.group_name)+'</span>':''}</span>
        <div class="btn-group">
          <button onclick="toggleLive('${d.id}')">${w?'⏹ {{ self.t('stop') }}':'▶ {{ self.t('watching') }}'}</button>
          ${(d.protocol===''||d.protocol==='phone')&&d.url&&d.url.startsWith('http')?'<button onclick="showPhone(\''+d.id+'\',\''+escAttr(d.name)+'\')">⚙️</button>':''}
          <button onclick="delDevice('${d.id}')" style="color:#ef9a9a">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return esc(s).replace(/'/g,'&#39;'); }

async function toggleLive(id) {
  var card = document.getElementById('card-'+id);
  var btn = card.querySelector('.btn-group button:first-child');
  var prev = document.getElementById('prev-'+id);
  var vid = document.getElementById('vid-'+id);
  if (btn.textContent.includes('⏹')) {
    await api('/proxy/'+id+'/stop', {method:'POST'});
    btn.innerHTML = '▶ {{ self.t('watching') }}';
    prev.style.display = 'flex';
    vid.style.display = 'none';
    if (window['hls_'+id]) { window['hls_'+id].destroy(); delete window['hls_'+id]; }
    return;
  }
  var r = await api('/proxy/'+id+'/start', {method:'POST'});
  if (r.status === 'started' && r.hls_url) {
    btn.innerHTML = '⏹ {{ self.t('stop') }}';
    prev.style.display = 'none';
    vid.style.display = 'block';
    if (Hls.isSupported()) {
      var h = new Hls();
      h.loadSource(r.hls_url);
      h.attachMedia(vid);
      h.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(()=>{}));
      window['hls_'+id] = h;
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = r.hls_url;
      vid.play().catch(()=>{});
    }
    toast('{{ self.t('watching') }} ' + id);
  } else {
    toast(r.error || '{{ self.t('connect_error') }}', 'e');
  }
}

async function delDevice(id) {
  if (!confirm('{{ self.t('delete_device') }}?')) return;
  await api('/devices/'+id+'/delete', {method:'POST'});
  var el = document.getElementById('card-'+id);
  if (el) el.remove();
  toast('{{ self.t('device_deleted') }}');
}

async function syncDevices() {
  var r = await api('/devices/sync');
  if (r.status === 'ok') { toast('{{ self.t('sync_ok') }} '+r.count); loadDevices(); }
  else toast('{{ self.t('sync_failed') }}', 'e');
}

function filterGroup() { renderDevices(); }
function setCols(n) { cols=n; document.querySelector('.live-grid').className='live-grid cols'+n; }

// Settings
function showSettings() { document.getElementById('settingsPanel').classList.add('open'); loadConfig(); }
function hideSettings() { document.getElementById('settingsPanel').classList.remove('open'); }
async function loadConfig() {
  var c = await api('/config');
  document.getElementById('cfgVsmUrl').value = c.vsm_api_url || '';
  document.getElementById('cfgHlsUrl').value = c.hls_base_url || '';
  document.getElementById('cfgWhepUrl').value = c.whep_base_url || '';
}
async function saveConfig() {
  await api('/config', {method:'POST', body:{
    vsm_api_url: document.getElementById('cfgVsmUrl').value,
    hls_base_url: document.getElementById('cfgHlsUrl').value,
    whep_base_url: document.getElementById('cfgWhepUrl').value,
  }});
  toast('{{ self.t('config_saved') }}');
  hideSettings();
}

// Phone camera settings
function showPhone(id, name) {
  var panel = document.getElementById('phonePanel');
  document.getElementById('phoneTitle').textContent = '📱 '+name;
  panel.classList.add('open');
  var html = '';
  html += '<div style="display:flex;gap:4px;margin-bottom:6px">';
  html += '<button onclick="phoneCmd(\''+id+'\',\'cam_switch?facing=front\')" style="flex:1;padding:4px;border:1px solid #1e2d3d;border-radius:3px;background:#0d151f;color:#c0d0e0;cursor:pointer">📷 {{ self.t('front_camera') }}</button>';
  html += '<button onclick="phoneCmd(\''+id+'\',\'cam_switch?facing=back\')" style="flex:1;padding:4px;border:1px solid #1e2d3d;border-radius:3px;background:#0d151f;color:#c0d0e0;cursor:pointer">📷 {{ self.t('back_camera') }}</button>';
  html += '</div>';
  html += '<div class="form-group"><label>{{ self.t('resolution') }}</label><select onchange="phoneCmd(\''+id+'\',\'resolution?value=\'+this.value)" style="width:100%;background:#0a121a;color:#d0d8e0;border:1px solid #1e2d3d;border-radius:4px;padding:4px;font-size:12px">';
  html += '<option value="640x480">640x480</option><option value="1280x720" selected>1280x720</option><option value="1920x1080">1920x1080</option></select></div>';
  html += '<div class="form-group"><label>{{ self.t('fps') }} <span id="phoneFps-'+id+'">15</span></label><input type="range" min="5" max="30" step="1" value="15" oninput="document.getElementById(\'phoneFps-'+id+'\').textContent=this.value" onchange="phoneCmd(\''+id+'\',\'fps?value=\'+this.value)"></div>';
  html += '<div class="form-group"><label>{{ self.t('quality') }} <span id="phoneQual-'+id+'">80</span></label><input type="range" min="10" max="100" step="5" value="80" oninput="document.getElementById(\'phoneQual-'+id+'\').textContent=this.value" onchange="phoneCmd(\''+id+'\',\'quality?value=\'+this.value)"></div>';
  html += '<div class="form-group"><label>{{ self.t('zoom') }} <span id="phoneZoom-'+id+'">1.0x</span></label><input type="range" min="1" max="8" step="0.1" value="1" oninput="document.getElementById(\'phoneZoom-'+id+'\').textContent=this.value+\'x\'" onchange="phoneCmd(\''+id+'\',\'zoom?value=\'+this.value)"></div>';
  html += '<div class="form-group"><label>{{ self.t('exposure') }} <span id="phoneEv-'+id+'">0.0</span></label><input type="range" min="-3" max="3" step="0.25" value="0" oninput="document.getElementById(\'phoneEv-'+id+'\').textContent=parseFloat(this.value).toFixed(2)" onchange="phoneCmd(\''+id+'\',\'exposure?value=\'+this.value)"></div>';
  html += '<div class="form-group"><label>{{ self.t('white_balance') }}</label><select onchange="phoneCmd(\''+id+'\',\'white_balance?mode=\'+this.value)" style="width:100%;background:#0a121a;color:#d0d8e0;border:1px solid #1e2d3d;border-radius:4px;padding:4px;font-size:12px">';
  html += '<option value="auto">自动</option><option value="sunny">晴天</option><option value="cloudy">阴天</option><option value="fluorescent">荧光灯</option><option value="incandescent">白炽灯</option></select></div>';
  document.getElementById('phoneControls').innerHTML = html;
}
function hidePhone() { document.getElementById('phonePanel').classList.remove('open'); }
async function phoneCmd(id, cmd) {
  var st = document.getElementById('phoneStatus');
  if (st) st.textContent = '⏳ '+cmd+'...';
  var r = await api('/phone/'+id+'/'+cmd, {method:'POST'});
  if (st) st.textContent = r.status==='ok'?'✅ '+(r.message||'ok'):'❌ '+(r.error||'fail');
}

loadDevices();
</script>
</body>
</html>
